name: kaiwan_chuaiduai
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.4


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+1
  path: ^1.9.1
  crypto: ^3.0.7
  pdf: ^3.13.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3



# The following section is specific to Flutter packages.
flutter:

  
  uses-material-design: true

  # รูปโลโก้ (ต้นฉบับอยู่ในโฟลเดอร์ design/)
  assets:
    - assets/images/
    - assets/fonts/ # ฟอนต์ไทย Sarabun สำหรับ export PDF (OFL)

  # ฟอนต์ที่ใช้วาดตาราง PDF (วาดด้วย Flutter แล้วแปลงเป็นรูป ภาษาไทยจึงแสดงถูกต้อง)
  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700

  
